<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Наші тарифи</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="pricing-shell">
      <section class="pricing-panel" aria-label="Наші тарифи">
        <h1>Наші тарифи</h1>
        <p class="subtitle">Оберіть план, який найкраще підійде для ваших завдань</p>

        <div class="pricing-grid">
          <article class="pricing-card">
            <div class="plan-name">BASIC</div>
            <div class="price">$10<span>/ month</span></div>
            <ul class="features">
              <li>✓ 1 User</li>
              <li>✓ 5GB Storage</li>
              <li>✓ Basic Support</li>
            </ul>
            <button class="btn" type="button">Select</button>
          </article>

          <article class="pricing-card featured">
            <div class="promo-badge">PRO • ACTIVE</div>
            <div class="plan-name">PRO</div>
            <div class="price">$29<span>/ month</span></div>
            <ul class="features">
              <li>✓ 5 Users</li>
              <li>✓ 50GB Storage</li>
              <li>✓ Priority Support</li>
            </ul>
            <button class="btn btn-primary" type="button">Get Started</button>
          </article>

          <article class="pricing-card">
            <div class="plan-name">ENTERPRISE</div>
            <div class="price">$99<span>/ month</span></div>
            <ul class="features">
              <li>✓ Unlimited</li>
              <li>✓ 1TB Storage</li>
              <li>✓ 24/7 Support</li>
            </ul>
            <button class="btn" type="button">Contact</button>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
